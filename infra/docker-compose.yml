services:
  postgres:
    image: postgres:16
    container_name: urbaneco_postgres
    restart: unless-stopped

    environment:
      POSTGRES_DB: urbaneco_dw
      POSTGRES_USER: urbaneco_user
      POSTGRES_PASSWORD: urbaneco_password

    ports:
      - "5432:5432"

    volumes:
      - postgres_data:/var/lib/postgresql/data

volumes:
  postgres_data: